<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Academia - Artes Marciales</title>
    <!-- Tailwind CSS para diseño rápido y moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Navegación -->
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                🥋 CRM Academia
            </h1>
            <span id="api-status" class="text-xs bg-red-500 px-2 py-1 rounded-full font-semibold">
                Desconectado
            </span>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Formulario: Registrar Pago -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 md:col-span-1">
            <h2 class="text-lg font-bold mb-4 border-b pb-2 text-slate-800">Registrar Pago</h2>
            
            <form id="form-pago" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">ID Alumno</label>
                    <input type="number" id="alumno_id" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">ID Profesor (Recibe)</label>
                    <input type="number" id="profesor_id" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">ID Centro / Sede</label>
                    <input type="number" id="centro_id" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Concepto</label>
                    <select id="tipo_concepto" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
                        <option value="CUOTA">CUOTA</option>
                        <option value="EXAMEN">EXAMEN</option>
                        <option value="MATRICULA">MATRICULA</option>
                        <option value="INSUMO">INSUMO</option>
                        <option value="OTRO">OTRO</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Monto ($)</label>
                    <input type="number" step="0.01" id="monto" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Método de Pago</label>
                    <select id="metodo_pago" class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
                        <option value="EFECTIVO">EFECTIVO</option>
                        <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-slate-900 text-white font-semibold py-2 rounded-lg hover:bg-slate-800 transition">
                    Guardar Pago
                </button>
            </form>
        </section>

        <!-- Tabla / Vista de Registros -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 md:col-span-2">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-lg font-bold text-slate-800">Últimos Pagos Registrados</h2>
                <button onclick="cargarPagos()" class="text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1 rounded-lg transition">
                    🔄 Actualizar
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-50 text-gray-700 uppercase text-xs">
                        <tr>
                            <th class="p-3">ID</th>
                            <th class="p-3">Alumno</th>
                            <th class="p-3">Concepto</th>
                            <th class="p-3">Monto</th>
                            <th class="p-3">Método</th>
                            <th class="p-3">Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-pagos" class="divide-y">
                        <tr>
                            <td colspan="6" class="p-4 text-center text-gray-400">Cargando datos...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- JS de integración con Flask -->
    <script>
        const API_URL = 'http://localhost:5000';

        // 1. Verificar estado del servidor Flask
        async function checkHealth() {
            const statusBadge = document.getElementById('api-status');
            try {
                const res = await fetch(`${API_URL}/`);
                if (res.ok) {
                    statusBadge.textContent = 'API Conectada';
                    statusBadge.className = 'text-xs bg-emerald-500 px-2 py-1 rounded-full font-semibold';
                }
            } catch (err) {
                statusBadge.textContent = 'Sin Conexión';
                statusBadge.className = 'text-xs bg-red-500 px-2 py-1 rounded-full font-semibold';
            }
        }

        // 2. Cargar pagos desde el backend
        async function cargarPagos() {
            const tbody = document.getElementById('tabla-pagos');
            try {
                const res = await fetch(`${API_URL}/pagos`);
                if (!res.ok) throw new Error();
                const pagos = await res.json();

                if (pagos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">No hay pagos registrados.</td></tr>`;
                    return;
                }

                tbody.innerHTML = pagos.map(p => `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 font-semibold">#${p.id}</td>
                        <td class="p-3">ID: ${p.alumno_id}</td>
                        <td class="p-3"><span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded">${p.tipo_concepto}</span></td>
                        <td class="p-3 font-medium text-emerald-600">$${p.monto}</td>
                        <td class="p-3">${p.metodo_pago}</td>
                        <td class="p-3 text-xs text-gray-400">${p.fecha_de_pago || 'Hoy'}</td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-500">Error al obtener pagos de la API.</td></tr>`;
            }
        }

        // 3. Enviar pago al backend
        document.getElementById('form-pago').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                alumno_id: parseInt(document.getElementById('alumno_id').value),
                profesor_id: parseInt(document.getElementById('profesor_id').value),
                centro_id: parseInt(document.getElementById('centro_id').value),
                tipo_concepto: document.getElementById('tipo_concepto').value,
                monto: parseFloat(document.getElementById('monto').value),
                metodo_pago: document.getElementById('metodo_pago').value
            };

            try {
                const res = await fetch(`${API_URL}/pagos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    alert('¡Pago registrado con éxito!');
                    document.getElementById('form-pago').reset();
                    cargarPagos();
                } else {
                    alert('Error al guardar el pago.');
                }
            } catch (err) {
                alert('No se pudo conectar con el servidor.');
            }
        });

        // Inicializar
        checkHealth();
        cargarPagos();
    </script>
</body>
</html>
